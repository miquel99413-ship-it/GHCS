<!DOCTYPE html>
<html lang="es">

<head>

<!-- Fuentes -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family: "Inter", sans-serif;

      background: #0d1312;
      color: #ffffff;

      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 520px;

      padding:
        max(24px, env(safe-area-inset-top))
        20px
        max(28px, env(safe-area-inset-bottom));

      margin: 0 auto;
    }

    /* =========================
       CABECERA
       ========================= */

    .cabecera {
      margin-bottom: 24px;
    }

    h1 {
      margin: 0;
      font-size: 34px;
      letter-spacing: 1px;
    }

    .subtitulo {
      margin: 4px 0 0;
      color: #63e6a3;
      font-size: 14px;
    }

    /* =========================
       CONEXIÓN
       ========================= */

    .conexion {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;

      margin-bottom: 20px;

      font-size: 13px;
    }

    .estado-ghcs {
      color: #f59e0b;
      font-weight: 600;
    }

    .estado-ghcs.online {
      color: #63e6a3;
    }

    .estado-ghcs.espera {
      color: #f59e0b;
    }

    .estado-ghcs.offline {
      color: #ff4d4d;
    }

    .ultima-actualizacion {
      color: #7f8c8a;
      text-align: right;
      font-size: 12px;
    }

    /* =========================
       TARJETAS
       ========================= */

    .tarjeta {
      position: relative;

      background: #19211f;

      border: 1px solid #293331;
      border-left: 4px solid #485451;

      border-radius: 17px;

      padding: 20px;

      margin-bottom: 14px;

      overflow: hidden;
    }

    .tarjeta-temperatura {
      border-left-color: #ff7a00;
    }

    .tarjeta-humedad {
      border-left-color: #63e6a3;
    }

    .tarjeta-bateria {
      border-left-color: #63e6a3;
    }

    .etiqueta {
      color: #aeb9b7;
      font-size: 13px;
      margin-bottom: 7px;
    }

    .valor {
      font-size: 36px;
      font-weight: 700;
      line-height: 1.1;
    }

    .valor-grande {
      font-size: 42px;
    }

    /* =========================
       VENTILADOR / MODO
       ========================= */

    .fila {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .estado-badge {
      display: inline-block;

      padding: 7px 11px;

      margin-top: 2px;

      border-radius: 9px;

      background: #28302f;

      font-size: 25px;
      font-weight: 700;
    }

    .vent-off {
      color: #aeb9b7;
    }

    .vent-v1 {
      color: #63e6a3;
    }

    .vent-v2 {
      color: #ffd166;
    }

    .vent-v3 {
      color: #ff7a00;
    }

    .modo-auto {
      color: #63e6a3;
    }

    .modo-manual {
      color: #ffb84d;
    }

    /* =========================
       BATERÍA
       ========================= */

    .cabecera-bateria {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .voltaje {
      color: #9aa6a4;
      font-size: 14px;
      margin-bottom: 4px;
    }

    .barra-bateria {
      width: 100%;
      height: 9px;

      margin-top: 16px;

      background: #303836;

      border-radius: 20px;

      overflow: hidden;
    }

    .relleno-bateria {
      width: 0%;
      height: 100%;

      background: #63e6a3;

      border-radius: inherit;

      transition:
        width 0.5s ease,
        background-color 0.3s ease;
    }
/* =========================
       HISTÓRICO
       ========================= */

    .seccion-historico {
      margin-top: 28px;
    }

    .cabecera-historico {
      margin-bottom: 14px;
    }

    .titulo-historico {
      margin: 0 0 4px;

      font-size: 20px;
      font-weight: 700;
    }

    .subtitulo-historico {
      margin: 0;

      color: #7f8c8a;

      font-size: 12px;
    }

    /* SELECTOR DE PERIODO */

    .selector-periodo {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;

      margin-bottom: 14px;

      padding: 5px;

      background: #151c1a;

      border: 1px solid #293331;
      border-radius: 12px;
    }

    .boton-periodo {
      appearance: none;
      border: 0;

      padding: 9px 4px;

      border-radius: 8px;

      background: transparent;
      color: #899592;

      font-size: 13px;
      font-weight: 600;

      cursor: pointer;

      transition:
        background 0.2s ease,
        color 0.2s ease;
    }

    .boton-periodo:hover {
      color: #ffffff;
    }

    .boton-periodo.activo {
      background: #28302f;
      color: #63e6a3;
    }

    /* GRÁFICAS */

    .tarjeta-grafica {
      background: #19211f;

      border: 1px solid #293331;

      border-radius: 17px;

      padding: 16px;

      margin-bottom: 14px;
    }

    .tarjeta-grafica-temperatura {
      border-left: 4px solid #ff7a00;
    }

    .tarjeta-grafica-humedad {
      border-left: 4px solid #63e6a3;
    }

    .cabecera-grafica {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;

      margin-bottom: 12px;
    }

    .titulo-grafica {
      font-size: 14px;
      font-weight: 600;
      color: #c5cecc;
    }

    .dato-grafica {
      color: #7f8c8a;
      font-size: 11px;
      text-align: right;
    }

    .contenedor-grafica {
      position: relative;
      width: 100%;
      height: 220px;
    }

    .estado-historico {
      margin-top: 8px;

      text-align: center;

      color: #667370;

      font-size: 11px;
    }

    /* =========================
       PIE
       ========================= */

    .pie {
      margin-top: 24px;

      text-align: center;

      color: #52605d;

      font-size: 11px;
    }

    /* =========================
       MÓVIL
       ========================= */

    @media (max-width: 430px) {

      .app {
        padding-left: 14px;
        padding-right: 14px;
      }

      h1 {
        font-size: 31px;
      }

      .valor-grande {
        font-size: 39px;
      }

      .tarjeta {
        padding: 18px;
      }

      .fila {
        gap: 10px;
      }

      .estado-badge {
        font-size: 23px;
      }

      .contenedor-grafica {
        height: 205px;
      }
    }

    @media (max-width: 350px) {

      .fila {
        grid-template-columns: 1fr;
      }

      .boton-periodo {
        font-size: 12px;
      }
    }
  /* =========================
   TIPOGRAFÍA GHCS
   ========================= */

/* Valores numéricos */
.valor,
.estado-badge,
.voltaje,
.dato-grafica {
  font-family: "Roboto Mono", monospace;
}

/* Botones */
button {
  font-family: "Roboto Mono", monospace;
}

/* Título provisionalmente */
h1 {
  font-weight: 700;
}
  </style>
</head>

  <script>

    /* =========================
       CONFIGURACIÓN API
       ========================= */

    const API_BASE =
      "https://ghcs-api.miquel99413.workers.dev";

    const API_DATOS =
      API_BASE + "/datos";

    const API_HISTORICO =
      API_BASE + "/historico";

    const API_CONTROL =
  API_BASE + "/control";

    /* =========================
       TIEMPOS
       ========================= */

    const LIMITE_ONLINE =
      7 * 60 * 1000;

    const LIMITE_OFFLINE =
      15 * 60 * 1000;

    /*
      Datos actuales:
      cada 30 segundos.
    */

    const INTERVALO_DATOS =
      30 * 1000;

    /*
      Histórico:
      cada 5 minutos.
    */

    const INTERVALO_HISTORICO =
      5 * 60 * 1000;


    /* =========================
       VARIABLES
       ========================= */

    let ultimoTimestamp =
      null;

    let periodoActual =
      "24h";

    let graficaTemperatura =
      null;

    let graficaHumedad =
      null;


    /* =========================
       CONSULTAR DATOS ACTUALES
       ========================= */

    async function consultarGHCS()
    {
      try
      {
        const respuesta =
          await fetch(
            API_DATOS,
            {
              cache: "no-store"
            }
          );

        if (!respuesta.ok)
        {
          throw new Error(
            "HTTP " +
            respuesta.status
          );
        }

        const datos =
          await respuesta.json();

        if (!datos.actual)
        {
          mostrarSinDatos();
          return;
        }

        actualizarInterfaz(
          datos.actual
        );
      }

      catch (error)
      {
        console.error(
          "Error consultando GHCS:",
          error
        );

        const estado =
          document.getElementById(
            "estadoGHCS"
          );

        estado.textContent =
          "● Error de conexión";

        estado.className =
          "estado-ghcs offline";
      }
    }


    /* =========================
       ACTUALIZAR INTERFAZ
       ========================= */

    function actualizarInterfaz(
      datos
    )
    {
      if (!datos.time)
      {
        mostrarSinDatos();
        return;
      }


      ultimoTimestamp =
        new Date(
          datos.time
        ).getTime();


      /* TEMPERATURA */

      if (
        datos.temperatura !==
        undefined &&
        datos.temperatura !==
        null
      )
      {
        document
          .getElementById(
            "temperatura"
          )
          .textContent =
          Number(
            datos.temperatura
          ).toFixed(1) +
          " °C";
      }


      /* HUMEDAD */

      if (
        datos.humedad !==
        undefined &&
        datos.humedad !==
        null
      )
      {
        document
          .getElementById(
            "humedad"
          )
          .textContent =
          Number(
            datos.humedad
          ).toFixed(1) +
          " %";
      }


      /* VENTILADOR */

      if (
        datos.ventilador
      )
      {
        actualizarVentilador(
          datos.ventilador
        );
      }


      /* MODO */

      if (
        datos.modo
      )
      {
        actualizarModo(
          datos.modo
        );
      }


      /* BATERÍA */

      if (
        datos.bateria_porcentaje !==
        undefined &&
        datos.bateria_porcentaje !==
        null
      )
      {
        const porcentaje =
          Number(
            datos.bateria_porcentaje
          );

        document
          .getElementById(
            "bateriaPorcentaje"
          )
          .textContent =
          porcentaje.toFixed(0);

        actualizarBateria(
          porcentaje
        );
      }


      /* VOLTAJE */

      if (
        datos.bateria_voltaje !==
        undefined &&
        datos.bateria_voltaje !==
        null
      )
      {
        document
          .getElementById(
            "bateriaVoltaje"
          )
          .textContent =
          Number(
            datos.bateria_voltaje
          ).toFixed(2);
      }


      actualizarEstadoGHCS();
    }


    /* =========================
       ESTADO REAL GHCS
       ========================= */

    function actualizarEstadoGHCS()
    {
      const estado =
        document.getElementById(
          "estadoGHCS"
        );

      const actualizacion =
        document.getElementById(
          "ultimaActualizacion"
        );


      if (!ultimoTimestamp)
      {
        estado.textContent =
          "● Sin datos";

        estado.className =
          "estado-ghcs offline";

        actualizacion.textContent =
          "Sin datos";

        return;
      }


      const antiguedad =
        Date.now() -
        ultimoTimestamp;


      if (
        antiguedad <=
        LIMITE_ONLINE
      )
      {
        estado.textContent =
          "● GHCS online";

        estado.className =
          "estado-ghcs online";
      }

      else if (
        antiguedad <=
        LIMITE_OFFLINE
      )
      {
        estado.textContent =
          "● Sin datos recientes";

        estado.className =
          "estado-ghcs espera";
      }

      else
      {
        estado.textContent =
          "● GHCS offline";

        estado.className =
          "estado-ghcs offline";
      }


      const segundos =
        Math.max(
          0,
          Math.floor(
            antiguedad /
            1000
          )
        );


      if (
        segundos < 10
      )
      {
        actualizacion.textContent =
          "Actualizado ahora";
      }

      else if (
        segundos < 60
      )
      {
        actualizacion.textContent =
          "Hace " +
          segundos +
          " s";
      }

      else if (
        segundos < 3600
      )
      {
        const minutos =
          Math.floor(
            segundos /
            60
          );

        actualizacion.textContent =
          "Hace " +
          minutos +
          " min";
      }

      else if (
        segundos < 86400
      )
      {
        const horas =
          Math.floor(
            segundos /
            3600
          );

        const minutos =
          Math.floor(
            (
              segundos %
              3600
            ) /
            60
          );

        actualizacion.textContent =
          "Hace " +
          horas +
          " h " +
          minutos +
          " min";
      }

      else
      {
        const dias =
          Math.floor(
            segundos /
            86400
          );

        actualizacion.textContent =
          "Hace " +
          dias +
          " días";
      }
    }


    /* =========================
       SIN DATOS
       ========================= */

    function mostrarSinDatos()
    {
      ultimoTimestamp =
        null;

      const estado =
        document.getElementById(
          "estadoGHCS"
        );

      estado.textContent =
        "● Sin datos";

      estado.className =
        "estado-ghcs offline";

      document
        .getElementById(
          "ultimaActualizacion"
        )
        .textContent =
        "Sin datos";
    }


    /* =========================
       VENTILADOR
       ========================= */

    function actualizarVentilador(
      estado
    )
    {
      const elemento =
        document.getElementById(
          "ventilador"
        );

      elemento.textContent =
        estado;

      elemento.className =
        "estado-badge";


      if (
        estado ===
        "APAGADO"
      )
      {
        elemento.classList.add(
          "vent-off"
        );
      }

      else if (
        estado ===
        "V1"
      )
      {
        elemento.classList.add(
          "vent-v1"
        );
      }

      else if (
        estado ===
        "V2"
      )
      {
        elemento.classList.add(
          "vent-v2"
        );
      }

      else if (
        estado ===
        "V3"
      )
      {
        elemento.classList.add(
          "vent-v3"
        );
      }
    }


    /* =========================
       MODO
       ========================= */

    function actualizarModo(
      modo
    )
    {
      const elemento =
        document.getElementById(
          "modo"
        );

      elemento.textContent =
        modo;

      elemento.className =
        "estado-badge";


      if (
        modo ===
        "AUTO"
      )
      {
        elemento.classList.add(
          "modo-auto"
        );
      }

      else
      {
        elemento.classList.add(
          "modo-manual"
        );
      }
    }


    /* =========================
       BATERÍA
       ========================= */

    function actualizarBateria(
      valor
    )
    {
      let porcentaje =
        parseFloat(
          valor
        );

      porcentaje =
        Math.max(
          0,
          Math.min(
            100,
            porcentaje
          )
        );


      const barra =
        document.getElementById(
          "rellenoBateria"
        );

      const tarjeta =
        document.getElementById(
          "tarjetaBateria"
        );


      barra.style.width =
        porcentaje +
        "%";


      if (
        porcentaje > 60
      )
      {
        barra.style.background =
          "#63e6a3";

        tarjeta.style
          .borderLeftColor =
          "#63e6a3";
      }

      else if (
        porcentaje > 30
      )
      {
        barra.style.background =
          "#ffb84d";

        tarjeta.style
          .borderLeftColor =
          "#ffb84d";
      }

      else
      {
        barra.style.background =
          "#ff4d4d";

        tarjeta.style
          .borderLeftColor =
          "#ff4d4d";
      }
    }


    /* =========================
       HISTÓRICO
       ========================= */

    async function consultarHistorico(
      periodo =
      periodoActual
    )
    {
      const estado =
        document.getElementById(
          "estadoHistorico"
        );

      estado.textContent =
        "Actualizando histórico...";


      try
      {
        const respuesta =
          await fetch(
            API_HISTORICO +
            "?periodo=" +
            encodeURIComponent(
              periodo
            ),
            {
              cache:
                "no-store"
            }
          );


        if (
          !respuesta.ok
        )
        {
          throw new Error(
            "HTTP " +
            respuesta.status
          );
        }


        const datos =
          await respuesta.json();


        dibujarHistorico(
          datos
        );


        estado.textContent =
          datos.puntos +
          " registros · " +
          periodo;
      }

      catch (error)
      {
        console.error(
          "Error histórico:",
          error
        );

        estado.textContent =
          "Error cargando histórico";
      }
    }


    /* =========================
       DIBUJAR HISTÓRICO
       ========================= */

    function dibujarHistorico(
      datos
    )
    {
      const temperaturas =
        datos.temperatura ||
        [];

      const humedades =
        datos.humedad ||
        [];


      /* TEMPERATURA */

      const etiquetasTemp =
        temperaturas.map(
          punto =>
            formatearFechaGrafica(
              punto.time
            )
        );

      const valoresTemp =
        temperaturas.map(
          punto =>
            Number(
              punto.value
            )
        );


      /* HUMEDAD */

      const etiquetasHum =
        humedades.map(
          punto =>
            formatearFechaGrafica(
              punto.time
            )
        );

      const valoresHum =
        humedades.map(
          punto =>
            Number(
              punto.value
            )
        );


      actualizarRangos(
        valoresTemp,
        valoresHum
      );


      /* DESTRUIR GRÁFICAS ANTERIORES */

      if (
        graficaTemperatura
      )
      {
        graficaTemperatura
          .destroy();
      }


      if (
        graficaHumedad
      )
      {
        graficaHumedad
          .destroy();
      }


      /* =========================
         GRÁFICA TEMPERATURA
         ========================= */

      graficaTemperatura =
        new Chart(
          document
            .getElementById(
              "graficaTemperatura"
            ),
          {
            type:
              "line",

            data:
            {
              labels:
                etiquetasTemp,

              datasets:
              [
                {
                  label:
                    "Temperatura",

                  data:
                    valoresTemp,

                  borderColor:
                    "#ff7a00",

                  backgroundColor:
                    "rgba(255,122,0,0.10)",

                  borderWidth:
                    2,

                  pointRadius:
                    valoresTemp.length >
                    60
                      ? 0
                      : 2,

                  pointHoverRadius:
                    5,

                  tension:
                    0.25,

                  fill:
                    true
                }
              ]
            },

            options:
              opcionesGrafica(
                "°C"
              )
          }
        );


      /* =========================
         GRÁFICA HUMEDAD
         ========================= */

      graficaHumedad =
        new Chart(
          document
            .getElementById(
              "graficaHumedad"
            ),
          {
            type:
              "line",

            data:
            {
              labels:
                etiquetasHum,

              datasets:
              [
                {
                  label:
                    "Humedad",

                  data:
                    valoresHum,

                  borderColor:
                    "#63e6a3",

                  backgroundColor:
                    "rgba(99,230,163,0.10)",

                  borderWidth:
                    2,

                  pointRadius:
                    valoresHum.length >
                    60
                      ? 0
                      : 2,

                  pointHoverRadius:
                    5,

                  tension:
                    0.25,

                  fill:
                    true
                }
              ]
            },

            options:
              opcionesGrafica(
                "%"
              )
          }
        );
    }


    /* =========================
       OPCIONES CHART.JS
       ========================= */

    function opcionesGrafica(
      unidad
    )
    {
      return {
        responsive:
          true,

        maintainAspectRatio:
          false,

        interaction:
        {
          intersect:
            false,

          mode:
            "index"
        },

        plugins:
        {
          legend:
          {
            display:
              false
          },

          tooltip:
          {
            displayColors:
              false,

            callbacks:
            {
              label:
                function (
                  contexto
                )
                {
                  return (
                    contexto
                      .parsed
                      .y
                      .toFixed(1) +
                    " " +
                    unidad
                  );
                }
            }
          }
        },

        scales:
        {
          x:
          {
            grid:
            {
              display:
                false
            },

            ticks:
            {
              color:
                "#71807c",

              maxTicksLimit:
                6,

              maxRotation:
                0,

              autoSkip:
                true
            },

            border:
            {
              color:
                "#33403d"
            }
          },

          y:
          {
            grid:
            {
              color:
                "rgba(120,140,135,0.12)"
            },

            ticks:
            {
              color:
                "#71807c",

              callback:
                function (
                  valor
                )
                {
                  return (
                    valor +
                    unidad
                  );
                }
            },

            border:
            {
              display:
                false
            }
          }
        }
      };
    }


    /* =========================
       FORMATO FECHA
       ========================= */

    function formatearFechaGrafica(
      timestamp
    )
    {
      const fecha =
        new Date(
          timestamp
        );


      if (
        periodoActual ===
        "7d"
      )
      {
        return fecha
          .toLocaleDateString(
            "es-ES",
            {
              day:
                "2-digit",

              month:
                "2-digit"
            }
          );
      }


      return fecha
        .toLocaleTimeString(
          "es-ES",
          {
            hour:
              "2-digit",

            minute:
              "2-digit"
          }
        );
    }


    /* =========================
       MÍN / MÁX
       ========================= */

    function actualizarRangos(
      temperaturas,
      humedades
    )
    {
      const rangoTemp =
        document.getElementById(
          "rangoTemperatura"
        );

      const rangoHum =
        document.getElementById(
          "rangoHumedad"
        );


      if (
        temperaturas.length >
        0
      )
      {
        const minimo =
          Math.min(
            ...temperaturas
          );

        const maximo =
          Math.max(
            ...temperaturas
          );

        rangoTemp.textContent =
          minimo.toFixed(1) +
          " / " +
          maximo.toFixed(1) +
          " °C";
      }

      else
      {
        rangoTemp.textContent =
          "--";
      }


      if (
        humedades.length >
        0
      )
      {
        const minimo =
          Math.min(
            ...humedades
          );

        const maximo =
          Math.max(
            ...humedades
          );

        rangoHum.textContent =
          minimo.toFixed(1) +
          " / " +
          maximo.toFixed(1) +
          " %";
      }

      else
      {
        rangoHum.textContent =
          "--";
      }
    }


    /* =========================
       SELECTOR PERIODO
       ========================= */

    document
      .querySelectorAll(
        ".boton-periodo"
      )
      .forEach(
        boton =>
        {
          boton
            .addEventListener(
              "click",
              function ()
              {
                periodoActual =
                  this.dataset
                    .periodo;


                document
                  .querySelectorAll(
                    ".boton-periodo"
                  )
                  .forEach(
                    b =>
                      b.classList
                        .remove(
                          "activo"
                        )
                  );


                this.classList
                  .add(
                    "activo"
                  );


                consultarHistorico(
                  periodoActual
                );
              }
            );
        }
      );

/* =========================
   CONTROL REMOTO
   ========================= */

async function enviarComando(comando)
{
  const estado =
    document.getElementById(
      "estadoControl"
    );

  let token =
    localStorage.getItem(
      "ghcs_control_token"
    );

  if (!token)
  {
    token = prompt(
      "Introduce el token de control del GHCS:"
    );

    if (!token)
    {
      estado.textContent =
        "Control cancelado";

      return;
    }

    token = token.trim();

    localStorage.setItem(
      "ghcs_control_token",
      token
    );
  }

  estado.textContent =
    "Enviando " +
    comando +
    "...";

  try
  {
    const respuesta =
      await fetch(
        API_CONTROL,
        {
          method: "POST",

          headers:
          {
            "Content-Type":
              "application/json",

            "X-Control-Token":
              token
          },

          body:
            JSON.stringify(
              {
                comando:
                  comando
              }
            )
        }
      );

    const datos =
      await respuesta.json();

    if (!respuesta.ok)
    {
      if (
        respuesta.status ===
        401
      )
      {
        localStorage.removeItem(
          "ghcs_control_token"
        );
      }

      throw new Error(
        datos.error ||
        "Error HTTP " +
        respuesta.status
      );
    }

    estado.textContent =
      "✓ " +
      comando +
      " enviado";

    // Refrescos rápidos tras enviar el comando
    setTimeout(
      consultarGHCS,
      500
    );

    setTimeout(
      consultarGHCS,
      1500
    );

    setTimeout(
      consultarGHCS,
      3000
    );
  }

  catch (error)
  {
    console.error(
      "Error control GHCS:",
      error
    );

    estado.textContent =
      "Error: " +
      error.message;
  }
}
    /* =========================
       INICIO
       ========================= */

    consultarGHCS();

    consultarHistorico(
      periodoActual
    );


    /* DATOS ACTUALES */

    setInterval(
      consultarGHCS,
      INTERVALO_DATOS
    );


    /* HISTÓRICO */

    setInterval(
      function ()
      {
        consultarHistorico(
          periodoActual
        );
      },
      INTERVALO_HISTORICO
    );


    /* TEXTO "HACE X MIN" */

    setInterval(
      actualizarEstadoGHCS,
      1000
    );

  </script>
