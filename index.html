<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#0d1312">

  <title>GHCS</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      background: #0d1312;
      color: #ffffff;

      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 520px;

      padding:
        max(24px, env(safe-area-inset-top))
        20px
        max(28px, env(safe-area-inset-bottom));

      margin: 0 auto;
    }

    /* CABECERA */

    .cabecera {
      margin-bottom: 24px;
    }

    h1 {
      margin: 0;
      font-size: 34px;
      letter-spacing: 1px;
    }

    .subtitulo {
      margin: 4px 0 0;
      color: #63e6a3;
      font-size: 14px;
    }

    /* CONEXIÓN */

    .conexion {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;

      margin-bottom: 20px;

      font-size: 13px;
    }

    .estado-ghcs {
      color: #f59e0b;
      font-weight: 600;
    }

    .estado-ghcs.online {
      color: #63e6a3;
    }

    .estado-ghcs.espera {
      color: #f59e0b;
    }

    .estado-ghcs.offline {
      color: #ff4d4d;
    }

    .ultima-actualizacion {
      color: #7f8c8a;
      text-align: right;
      font-size: 12px;
    }

    /* TARJETAS */

    .tarjeta {
      position: relative;

      background: #19211f;

      border: 1px solid #293331;
      border-left: 4px solid #485451;

      border-radius: 17px;

      padding: 20px;

      margin-bottom: 14px;

      overflow: hidden;
    }

    .tarjeta-temperatura {
      border-left-color: #ff7a00;
    }

    .tarjeta-humedad {
      border-left-color: #63e6a3;
    }

    .tarjeta-bateria {
      border-left-color: #63e6a3;
    }

    .etiqueta {
      color: #aeb9b7;
      font-size: 13px;
      margin-bottom: 7px;
    }

    .valor {
      font-size: 36px;
      font-weight: 700;
      line-height: 1.1;
    }

    .valor-grande {
      font-size: 42px;
    }

    /* VENTILADOR Y MODO */

    .fila {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .estado-badge {
      display: inline-block;

      padding: 7px 11px;

      margin-top: 2px;

      border-radius: 9px;

      background: #28302f;

      font-size: 25px;
      font-weight: 700;
    }

    .vent-off {
      color: #aeb9b7;
    }

    .vent-v1 {
      color: #63e6a3;
    }

    .vent-v2 {
      color: #ffd166;
    }

    .vent-v3 {
      color: #ff7a00;
    }

    .modo-auto {
      color: #63e6a3;
    }

    .modo-manual {
      color: #ffb84d;
    }

    /* BATERÍA */

    .cabecera-bateria {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .voltaje {
      color: #9aa6a4;
      font-size: 14px;
      margin-bottom: 4px;
    }

    .barra-bateria {
      width: 100%;
      height: 9px;

      margin-top: 16px;

      background: #303836;

      border-radius: 20px;

      overflow: hidden;
    }

    .relleno-bateria {
      width: 0%;
      height: 100%;

      background: #63e6a3;

      border-radius: inherit;

      transition:
        width 0.5s ease,
        background-color 0.3s ease;
    }

    /* PIE */

    .pie {
      margin-top: 20px;

      text-align: center;

      color: #52605d;

      font-size: 11px;
    }

    /* MÓVIL */

    @media (max-width: 430px) {

      .app {
        padding-left: 14px;
        padding-right: 14px;
      }

      h1 {
        font-size: 31px;
      }

      .valor-grande {
        font-size: 39px;
      }

      .tarjeta {
        padding: 18px;
      }

      .fila {
        gap: 10px;
      }

      .estado-badge {
        font-size: 23px;
      }
    }

    @media (max-width: 350px) {

      .fila {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <header class="cabecera">

      <h1>GHCS</h1>

      <p class="subtitulo">
        Greenhouse Climate System
      </p>

    </header>

    <div class="conexion">

      <div
        class="estado-ghcs"
        id="estadoGHCS"
      >
        ● Comprobando GHCS...
      </div>

      <div
        class="ultima-actualizacion"
        id="ultimaActualizacion"
      >
        Sin datos
      </div>

    </div>

    <!-- TEMPERATURA -->

    <section class="tarjeta tarjeta-temperatura">

      <div class="etiqueta">
        Temperatura
      </div>

      <div
        class="valor valor-grande"
        id="temperatura"
      >
        --.- °C
      </div>

    </section>

    <!-- HUMEDAD -->

    <section class="tarjeta tarjeta-humedad">

      <div class="etiqueta">
        Humedad
      </div>

      <div
        class="valor valor-grande"
        id="humedad"
      >
        --.- %
      </div>

    </section>

    <!-- VENTILADOR / MODO -->

    <div class="fila">

      <section class="tarjeta">

        <div class="etiqueta">
          Ventilador
        </div>

        <div
          class="estado-badge"
          id="ventilador"
        >
          ---
        </div>

      </section>

      <section class="tarjeta">

        <div class="etiqueta">
          Modo
        </div>

        <div
          class="estado-badge"
          id="modo"
        >
          ---
        </div>

      </section>

    </div>

    <!-- BATERÍA -->

    <section
      class="tarjeta tarjeta-bateria"
      id="tarjetaBateria"
    >

      <div class="etiqueta">
        Batería
      </div>

      <div class="cabecera-bateria">

        <div class="valor">

          <span id="bateriaPorcentaje">
            --
          </span> %

        </div>

        <div class="voltaje">

          <span id="bateriaVoltaje">
            -.--
          </span> V

        </div>

      </div>

      <div class="barra-bateria">

        <div
          class="relleno-bateria"
          id="rellenoBateria"
        ></div>

      </div>

    </section>

    <div class="pie">
      GHCS · Remote Monitoring
    </div>

  </main>

  <script>

    /* =========================
       CONFIGURACIÓN API
       ========================= */

    const API_URL =
      "https://ghcs-api.miquel99413.workers.dev/datos";

    /*
      InfluxDB recibe un registro cada 5 minutos.

      < 7 min  = ONLINE
      7-15 min = SIN DATOS RECIENTES
      > 15 min = OFFLINE
    */

    const LIMITE_ONLINE =
      7 * 60 * 1000;

    const LIMITE_OFFLINE =
      15 * 60 * 1000;

    /*
      Consultamos Cloudflare cada 30 segundos.

      Esto NO hace que InfluxDB almacene más datos.
      Solo comprueba si existe un registro nuevo.
    */

    const INTERVALO_CONSULTA =
      30 * 1000;

    let ultimoTimestamp = null;


    /* =========================
       CONSULTAR GHCS
       ========================= */

    async function consultarGHCS()
    {
      try
      {
        const respuesta =
          await fetch(
            API_URL,
            {
              cache: "no-store"
            }
          );

        if (!respuesta.ok)
        {
          throw new Error(
            "HTTP " + respuesta.status
          );
        }

        const datos =
          await respuesta.json();

        if (!datos.actual)
        {
          mostrarSinDatos();
          return;
        }

        actualizarInterfaz(
          datos.actual
        );
      }

      catch (error)
      {
        console.error(
          "Error consultando GHCS:",
          error
        );

        const estado =
          document.getElementById(
            "estadoGHCS"
          );

        estado.textContent =
          "● Error de conexión";

        estado.className =
          "estado-ghcs offline";
      }
    }


    /* =========================
       ACTUALIZAR INTERFAZ
       ========================= */

    function actualizarInterfaz(datos)
    {
      if (!datos.time)
      {
        mostrarSinDatos();
        return;
      }

      ultimoTimestamp =
        new Date(datos.time).getTime();


      /* TEMPERATURA */

      if (
        datos.temperatura !==
        undefined &&
        datos.temperatura !== null
      )
      {
        document
          .getElementById(
            "temperatura"
          )
          .textContent =
          Number(
            datos.temperatura
          ).toFixed(1) +
          " °C";
      }


      /* HUMEDAD */

      if (
        datos.humedad !==
        undefined &&
        datos.humedad !== null
      )
      {
        document
          .getElementById(
            "humedad"
          )
          .textContent =
          Number(
            datos.humedad
          ).toFixed(1) +
          " %";
      }


      /* VENTILADOR */

      if (datos.ventilador)
      {
        actualizarVentilador(
          datos.ventilador
        );
      }


      /* MODO */

      if (datos.modo)
      {
        actualizarModo(
          datos.modo
        );
      }


      /* BATERÍA */

      if (
        datos.bateria_porcentaje !==
        undefined &&
        datos.bateria_porcentaje !== null
      )
      {
        const porcentaje =
          Number(
            datos.bateria_porcentaje
          );

        document
          .getElementById(
            "bateriaPorcentaje"
          )
          .textContent =
          porcentaje.toFixed(0);

        actualizarBateria(
          porcentaje
        );
      }


      /* VOLTAJE */

      if (
        datos.bateria_voltaje !==
        undefined &&
        datos.bateria_voltaje !== null
      )
      {
        document
          .getElementById(
            "bateriaVoltaje"
          )
          .textContent =
          Number(
            datos.bateria_voltaje
          ).toFixed(2);
      }


      actualizarEstadoGHCS();
    }


    /* =========================
       ESTADO REAL DEL GHCS
       ========================= */

    function actualizarEstadoGHCS()
    {
      const estado =
        document.getElementById(
          "estadoGHCS"
        );

      const actualizacion =
        document.getElementById(
          "ultimaActualizacion"
        );


      if (!ultimoTimestamp)
      {
        estado.textContent =
          "● Sin datos";

        estado.className =
          "estado-ghcs offline";

        actualizacion.textContent =
          "Sin datos";

        return;
      }


      const antiguedad =
        Date.now() -
        ultimoTimestamp;


      /* ONLINE */

      if (
        antiguedad <=
        LIMITE_ONLINE
      )
      {
        estado.textContent =
          "● GHCS online";

        estado.className =
          "estado-ghcs online";
      }


      /* DATOS ANTIGUOS */

      else if (
        antiguedad <=
        LIMITE_OFFLINE
      )
      {
        estado.textContent =
          "● Sin datos recientes";

        estado.className =
          "estado-ghcs espera";
      }


      /* OFFLINE */

      else
      {
        estado.textContent =
          "● GHCS offline";

        estado.className =
          "estado-ghcs offline";
      }


      /* TEXTO ÚLTIMA ACTUALIZACIÓN */

      const segundos =
        Math.max(
          0,
          Math.floor(
            antiguedad / 1000
          )
        );


      if (segundos < 10)
      {
        actualizacion.textContent =
          "Actualizado ahora";
      }

      else if (segundos < 60)
      {
        actualizacion.textContent =
          "Hace " +
          segundos +
          " s";
      }

      else if (segundos < 3600)
      {
        const minutos =
          Math.floor(
            segundos / 60
          );

        actualizacion.textContent =
          "Hace " +
          minutos +
          " min";
      }

      else if (segundos < 86400)
      {
        const horas =
          Math.floor(
            segundos / 3600
          );

        const minutos =
          Math.floor(
            (segundos % 3600) /
            60
          );

        actualizacion.textContent =
          "Hace " +
          horas +
          " h " +
          minutos +
          " min";
      }

      else
      {
        const dias =
          Math.floor(
            segundos / 86400
          );

        actualizacion.textContent =
          "Hace " +
          dias +
          " días";
      }
    }


    /* =========================
       SIN DATOS
       ========================= */

    function mostrarSinDatos()
    {
      ultimoTimestamp = null;

      const estado =
        document.getElementById(
          "estadoGHCS"
        );

      estado.textContent =
        "● Sin datos";

      estado.className =
        "estado-ghcs offline";

      document
        .getElementById(
          "ultimaActualizacion"
        )
        .textContent =
        "Sin datos";
    }


    /* =========================
       VENTILADOR
       ========================= */

    function actualizarVentilador(
      estado
    )
    {
      const elemento =
        document.getElementById(
          "ventilador"
        );

      elemento.textContent =
        estado;

      elemento.className =
        "estado-badge";


      if (estado === "APAGADO")
      {
        elemento.classList.add(
          "vent-off"
        );
      }

      else if (estado === "V1")
      {
        elemento.classList.add(
          "vent-v1"
        );
      }

      else if (estado === "V2")
      {
        elemento.classList.add(
          "vent-v2"
        );
      }

      else if (estado === "V3")
      {
        elemento.classList.add(
          "vent-v3"
        );
      }
    }


    /* =========================
       MODO
       ========================= */

    function actualizarModo(
      modo
    )
    {
      const elemento =
        document.getElementById(
          "modo"
        );

      elemento.textContent =
        modo;

      elemento.className =
        "estado-badge";


      if (modo === "AUTO")
      {
        elemento.classList.add(
          "modo-auto"
        );
      }

      else
      {
        elemento.classList.add(
          "modo-manual"
        );
      }
    }


    /* =========================
       BATERÍA
       ========================= */

    function actualizarBateria(
      valor
    )
    {
      let porcentaje =
        parseFloat(valor);

      porcentaje =
        Math.max(
          0,
          Math.min(
            100,
            porcentaje
          )
        );

      const barra =
        document.getElementById(
          "rellenoBateria"
        );

      const tarjeta =
        document.getElementById(
          "tarjetaBateria"
        );

      barra.style.width =
        porcentaje + "%";


      if (porcentaje > 60)
      {
        barra.style.background =
          "#63e6a3";

        tarjeta.style.borderLeftColor =
          "#63e6a3";
      }

      else if (porcentaje > 30)
      {
        barra.style.background =
          "#ffb84d";

        tarjeta.style.borderLeftColor =
          "#ffb84d";
      }

      else
      {
        barra.style.background =
          "#ff4d4d";

        tarjeta.style.borderLeftColor =
          "#ff4d4d";
      }
    }


    /* =========================
       INICIO
       ========================= */

    consultarGHCS();

    setInterval(
      consultarGHCS,
      INTERVALO_CONSULTA
    );

    /*
      Actualizamos el texto "Hace X min"
      aunque todavía no toque consultar
      de nuevo la API.
    */

    setInterval(
      actualizarEstadoGHCS,
      1000
    );

  </script>

</body>

</html>
